  <script>/* ponytail: wordcraft-web 0.10.0 UI font is Latin-only, so a Chinese navigator paints every label as ?. */try{const lang="en-US";Object.defineProperty(Navigator.prototype,"language",{get(){return lang}});Object.defineProperty(Navigator.prototype,"languages",{get(){return [lang]}})}catch(e){}</script>

<script type="module">
import init, * as bindings from './wordcraft-web-9242e10ddc86b8c1.js';
async function seedWordcraftCjk(){/* ponytail: wordcraft-web 0.10.0 ships no CJK face; IndexedDB wordcraft/fonts is loaded at startup. */const key="NotoSansCJKsc-Regular.otf";const db=await new Promise((ok,err)=>{const req=indexedDB.open("wordcraft",1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("fonts"))req.result.createObjectStore("fonts")};req.onsuccess=()=>ok(req.result);req.onerror=()=>err(req.error)});const have=await new Promise((ok,err)=>{const q=db.transaction("fonts").objectStore("fonts").get(key);q.onsuccess=()=>ok(q.result);q.onerror=()=>err(q.error)});if(have){db.close();return}const res=await fetch("./"+key);if(!res.ok)throw new Error("cjk font "+res.status);const bytes=new Uint8Array(await res.arrayBuffer());await new Promise((ok,err)=>{const q=db.transaction("fonts","readwrite").objectStore("fonts").put(bytes,key);q.onsuccess=()=>ok();q.onerror=()=>err(q.error)});db.close()}
try{await seedWordcraftCjk()}catch(e){console.warn(e)}
const wasm = await init({ module_or_path: './wordcraft-web-9242e10ddc86b8c1_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
